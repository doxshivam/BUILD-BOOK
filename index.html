<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BuildBook — Construction Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16324F;
    --navy-deep:#0E2238;
    --paper:#EFEDE6;
    --paper-line:#CFC9B8;
    --ink:#1C1C1A;
    --ink-soft:#5B5A53;
    --saffron:#E8A33D;
    --saffron-deep:#C7841F;
    --green:#4C7A5E;
    --red:#B4553F;
    --card:#FFFFFF;
    --radius:14px;
    --shadow: 0 2px 10px rgba(22,50,79,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 22px 22px;
    background-attachment: fixed;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  ::selection{background:var(--saffron); color:var(--navy-deep);}

  /* ===== Lock screen ===== */
  #lockScreen{
    position:fixed; inset:0; background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    z-index:999; padding:24px;
  }
  .lock-card{
    background:var(--card); border-radius:var(--radius);
    padding:32px 24px; width:100%; max-width:360px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    text-align:center;
  }
  .lock-card .rivet{
    width:44px;height:44px;border-radius:50%;
    background:var(--saffron); margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .lock-card h2{margin:0 0 6px; font-size:19px; letter-spacing:0.02em;}
  .lock-card p{margin:0 0 20px; color:var(--ink-soft); font-size:13.5px;}
  .lock-card input{
    width:100%; padding:13px 14px; border-radius:10px;
    border:1.5px solid var(--paper-line); font-size:16px;
    text-align:center; letter-spacing:0.15em; font-family:'IBM Plex Mono',monospace;
  }
  .lock-card input:focus{outline:none; border-color:var(--saffron);}
  .lock-card button{
    margin-top:14px; width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--navy); color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; letter-spacing:0.02em;
  }
  .lock-error{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px;}

  /* ===== App shell ===== */
  #app{display:none; max-width:520px; margin:0 auto; padding-bottom:100px;}
  header.site{
    background:var(--navy); color:#fff;
    padding:22px 20px 26px;
    border-bottom-left-radius:22px; border-bottom-right-radius:22px;
    box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  header.site::after{
    content:""; position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:rgba(232,163,61,0.12);
  }
  .site-tag{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:#F0C98A; opacity:0.9; margin-bottom:4px;
  }
  header.site h1{margin:0 0 18px; font-size:22px; font-weight:600;}
  .total-block{position:relative; z-index:1;}
  .total-label{font-size:12px; color:#C9D6E4; text-transform:uppercase; letter-spacing:0.1em;}
  .total-amount{font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:700; margin-top:4px;}
  .total-sub{font-size:12.5px; color:#AABDD0; margin-top:6px;}
  .total-sub span{color:var(--saffron);}

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:16px 20px 4px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; background:var(--card); border-radius:10px;
    padding:8px 12px; box-shadow:var(--shadow); min-width:96px;
  }
  .chip .c-label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .chip .c-amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; margin-top:2px;}

  .section-title{
    padding:20px 20px 8px; font-size:13px; font-weight:600;
    color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em;
    display:flex; align-items:center; justify-content:space-between;
  }
  .refresh-btn{
    border:none; background:none; color:var(--navy); font-size:12px;
    font-weight:600; cursor:pointer; font-family:inherit; padding:4px 6px;
  }

  #entries{padding:0 20px; display:flex; flex-direction:column; gap:10px;}
  .entry{
    background:var(--card); border-radius:12px; padding:14px 14px;
    box-shadow:var(--shadow); display:flex; gap:12px; position:relative;
    border-left:3px dashed var(--paper-line);
  }
  .entry .e-date{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; min-width:38px; padding-top:2px;
  }
  .entry .e-date b{font-size:16px; color:var(--ink); line-height:1.1;}
  .entry .e-body{flex:1; min-width:0;}
  .entry .e-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .entry .e-vendor{font-weight:600; font-size:14.5px;}
  .entry .e-amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:var(--green); white-space:nowrap;}
  .entry .e-tag{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    background:rgba(22,50,79,0.08); color:var(--navy); padding:2px 7px;
    border-radius:5px; margin-top:5px; font-weight:600;
  }
  .entry .e-remaining{
    font-size:11.5px; color:var(--red); margin-top:4px; font-family:'IBM Plex Mono',monospace;
  }
  .entry .e-notes{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .entry .e-photo-link{font-size:11.5px; color:var(--navy); margin-top:6px; display:inline-block; text-decoration:underline;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state .big{font-size:38px; margin-bottom:8px;}

  /* ===== FAB ===== */
  .fab{
    position:fixed; bottom:22px; right:22px; z-index:60;
    width:58px; height:58px; border-radius:50%;
    background:var(--saffron); color:var(--navy-deep);
    border:none; font-size:28px; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    max-width:520px; margin:0 auto;
  }

  /* ===== Bottom sheet form ===== */
  #overlay{
    position:fixed; inset:0; background:rgba(14,34,56,0.45);
    display:none; z-index:70;
  }
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    background:var(--paper); border-top-left-radius:20px; border-top-right-radius:20px;
    max-width:520px; margin:0 auto; max-height:92vh; overflow-y:auto;
    transform:translateY(100%); transition:transform 0.28s ease;
    box-shadow:0 -8px 30px rgba(0,0,0,0.25);
  }
  #sheet.open{transform:translateY(0);}
  .sheet-handle{width:40px; height:4px; background:var(--paper-line); border-radius:3px; margin:10px auto 4px;}
  .sheet-head{padding:6px 20px 14px; display:flex; justify-content:space-between; align-items:center;}
  .sheet-head h3{margin:0; font-size:17px;}
  .close-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; padding:4px 8px;}

  form#entryForm{padding:0 20px 26px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid var(--paper-line);
    font-size:15px; font-family:inherit; background:var(--card); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--saffron);}
  textarea{resize:vertical; min-height:56px;}
  .remaining-hint{
    font-size:12.5px; margin-top:6px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);
  }
  .remaining-hint b{color:var(--green);}
  .remaining-hint.due b{color:var(--red);}

  .photo-input{
    display:flex; align-items:center; gap:10px; border:1.5px dashed var(--paper-line);
    border-radius:10px; padding:12px; background:var(--card); cursor:pointer;
  }
  .photo-input input{display:none;}
  .photo-input span{font-size:13.5px; color:var(--ink-soft);}
  .photo-preview{margin-top:8px; max-width:100%; border-radius:8px; display:none;}

  .submit-btn{
    width:100%; padding:14px; border:none; border-radius:10px;
    background:var(--navy); color:#fff; font-size:15.5px; font-weight:600;
    cursor:pointer; margin-top:6px;
  }
  .submit-btn:disabled{opacity:0.6;}

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:13.5px; opacity:0; transition:all 0.25s ease; z-index:200; pointer-events:none;
    max-width:88%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .config-warning{
    margin:16px 20px; padding:12px 14px; background:#FBEBD8; border:1px solid var(--saffron);
    border-radius:10px; font-size:12.5px; color:var(--navy-deep);
  }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="rivet">🏗️</div>
    <h2>BuildBook</h2>
    <p>Password daalke andar aayein</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button onclick="tryUnlock()">Unlock</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="site">
    <div class="site-tag">Site Ledger</div>
    <h1>🏗️ BuildBook</h1>
    <div class="total-block">
      <div class="total-label">Total Spent So Far</div>
      <div class="total-amount mono">₹<span id="totalAmt">0</span></div>
      <div class="total-sub">Paid: ₹<span id="totalPaid">0</span> &nbsp;•&nbsp; Due: <span>₹<span id="totalDue">0</span></span></div>
    </div>
  </header>

  <div class="chips" id="categoryChips"></div>

  <div class="section-title">
    Recent Entries
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
  <div id="entries"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">🧱</div>
    Abhi tak koi entry nahi hai.<br>Neeche + button se pehli entry add karein.
  </div>
</div>

<button class="fab" onclick="openSheet()">+</button>

<div id="overlay" onclick="closeSheet()"></div>
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Add New Entry</h3>
    <button class="close-btn" onclick="closeSheet()">✕</button>
  </div>
  <form id="entryForm" onsubmit="submitEntry(event)">
    <div class="row2">
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="fTime" required>
      </div>
    </div>

    <div class="field">
      <label>Category</label>
      <select id="fCategory" onchange="onCategoryChange()">
        <optgroup label="Material">
          <option>Cement</option>
          <option>Sand / Dust</option>
          <option>Bricks</option>
          <option>Steel / Rod</option>
          <option>Tiles / Marble</option>
          <option>Paint</option>
          <option>Electrical Material</option>
          <option>Plumbing / Sanitary Material</option>
          <option>Wood / Furniture</option>
          <option>Hardware / Misc Material</option>
        </optgroup>
        <optgroup label="Labour / Payment">
          <option>Thekedaar (Mistri Labour)</option>
          <option>Plumber</option>
          <option>Electrician</option>
          <option>Painter</option>
          <option>Carpenter</option>
        </optgroup>
        <option>Transport</option>
        <option value="__other__">Other (type below)</option>
      </select>
      <input type="text" id="fCategoryOther" placeholder="Category likhein" style="margin-top:8px; display:none;">
    </div>

    <div class="field">
      <label>Vendor / Person Name</label>
      <input type="text" id="fVendor" placeholder="e.g. Sharma Cement Store / Ramesh Thekedaar" required>
    </div>

    <div class="field">
      <label>Paid By</label>
      <select id="fPaidBy" required>
        <option value="" disabled selected>Select who is paying</option>
        <option>Papa</option>
        <option>Prince</option>
        <option>Shivam</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label>Total Bill Amount (₹)</label>
        <input type="number" id="fTotal" placeholder="0" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label>Amount Paid Now (₹)</label>
        <input type="number" id="fPaid" placeholder="0" min="0" step="0.01" required>
      </div>
    </div>
    <div class="remaining-hint" id="remainingHint">Remaining: ₹0</div>

    <div class="field" style="margin-top:16px;">
      <label>Notes (optional)</label>
      <textarea id="fNotes" placeholder="e.g. 2nd installment, 50 bags cement"></textarea>
    </div>

    <div class="field">
      <label>Bill Photo (optional)</label>
      <label class="photo-input">
        <input type="file" id="fPhoto" accept="image/*" capture="environment" onchange="onPhotoChange(event)">
        <span id="photoLabel">📷 Tap to upload / click bill photo</span>
      </label>
      <img id="photoPreview" class="photo-preview">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Save Entry</button>
  </form>
</div>

<div id="toast"></div>

<script>
/* ================= CONFIG — EDIT THESE TWO LINES ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwE69ZALbbqkkZhiGTq18Ge5xOLDs28jjTrBrCKf7kCwdLa5KBH5x4D36vhhHrbkWhN/exec";
const APP_PASSWORD = "Shivam@123"; // change this before you publish the site
/* ==================================================================== */

let allEntries = [];
let photoBase64 = null, photoFileName = null;

// ---------- Lock screen ----------
function tryUnlock(){
  const val = document.getElementById('pwInput').value;
  if(val === APP_PASSWORD){
    localStorage.setItem('gk_unlocked', '1');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('lockError').textContent = 'Galat password, dobara try karein.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });

window.addEventListener('DOMContentLoaded', () => {
  if(localStorage.getItem('gk_unlocked') === '1'){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  }
  const now = new Date();
  document.getElementById('fDate').value = now.toISOString().slice(0,10);
  document.getElementById('fTime').value = now.toTimeString().slice(0,5);

  if(SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    const warn = document.createElement('div');
    warn.className = 'config-warning';
    warn.innerHTML = '⚠️ Setup abhi baaki hai — index.html ke top mein SCRIPT_URL paste karein (SETUP-GUIDE.md dekhein).';
    document.getElementById('app').prepend(warn);
  }
});

// ---------- Sheet open/close ----------
function openSheet(){
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('sheet').classList.remove('open');
}
function onCategoryChange(){
  const v = document.getElementById('fCategory').value;
  document.getElementById('fCategoryOther').style.display = (v === '__other__') ? 'block' : 'none';
}
document.getElementById('fTotal').addEventListener('input', updateRemaining);
document.getElementById('fPaid').addEventListener('input', updateRemaining);
function updateRemaining(){
  const total = parseFloat(document.getElementById('fTotal').value) || 0;
  const paid = parseFloat(document.getElementById('fPaid').value) || 0;
  const rem = total - paid;
  const hint = document.getElementById('remainingHint');
  hint.classList.toggle('due', rem > 0);
  hint.innerHTML = rem > 0
    ? `Remaining: <b style="color:var(--red)">₹${rem.toFixed(2)}</b>`
    : `Remaining: <b>₹0</b> — fully paid ✓`;
}

function onPhotoChange(e){
  const file = e.target.files[0];
  if(!file) return;
  photoFileName = file.name;
  const reader = new FileReader();
  reader.onload = function(evt){
    photoBase64 = evt.target.result;
    document.getElementById('photoPreview').src = photoBase64;
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoLabel').textContent = '✓ ' + file.name;
  };
  reader.readAsDataURL(file);
}

// ---------- Submit ----------
function submitEntry(e){
  e.preventDefault();
  if(SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    showToast('Pehle SCRIPT_URL set karein (SETUP-GUIDE.md dekhein)');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  let category = document.getElementById('fCategory').value;
  if(category === '__other__') category = document.getElementById('fCategoryOther').value || 'Other';

  const payload = {
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    category: category,
    vendorName: document.getElementById('fVendor').value,
    paidBy: document.getElementById('fPaidBy').value,
    totalAmount: document.getElementById('fTotal').value,
    amountPaid: document.getElementById('fPaid').value,
    notes: document.getElementById('fNotes').value,
    photoBase64: photoBase64,
    photoName: photoFileName
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    btn.disabled = false; btn.textContent = 'Save Entry';
    if(res.success){
      showToast('Entry saved ✓');
      document.getElementById('entryForm').reset();
      photoBase64 = null; photoFileName = null;
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('photoLabel').textContent = '📷 Tap to upload / click bill photo';
      const now = new Date();
      document.getElementById('fDate').value = now.toISOString().slice(0,10);
      document.getElementById('fTime').value = now.toTimeString().slice(0,5);
      onCategoryChange();
      closeSheet();
      loadData();
    } else {
      showToast('Error: ' + (res.error || 'kuch गलत हुआ'));
    }
  })
  .catch(err => {
    btn.disabled = false; btn.textContent = 'Save Entry';
    showToast('Network error — dobara try karein');
  });
}

// ---------- Load & render ----------
function loadData(){
  if(SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
  document.getElementById('entries').innerHTML = '<div class="empty-state">Loading...</div>';
  fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(res => {
      if(res.success){
        allEntries = res.data.reverse();
        renderSummary();
        renderEntries();
      }
    })
    .catch(() => { showToast('Data load nahi ho paya'); });
}

function renderSummary(){
  let totalPaid = 0, totalDue = 0, totalBill = 0;
  const catTotals = {};
  allEntries.forEach(en => {
    const paid = parseFloat(en.AmountPaid) || 0;
    const total = parseFloat(en.TotalAmount) || 0;
    totalPaid += paid; totalBill += total;
    totalDue += Math.max(total - paid, 0);
    const cat = en.Category || 'Other';
    catTotals[cat] = (catTotals[cat] || 0) + paid;
  });
  document.getElementById('totalAmt').textContent = totalPaid.toLocaleString('en-IN');
  document.getElementById('totalPaid').textContent = totalPaid.toLocaleString('en-IN');
  document.getElementById('totalDue').textContent = totalDue.toLocaleString('en-IN');

  const chipsEl = document.getElementById('categoryChips');
  chipsEl.innerHTML = '';
  Object.entries(catTotals).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<div class="c-label">${cat}</div><div class="c-amt mono">₹${amt.toLocaleString('en-IN')}</div>`;
    chipsEl.appendChild(chip);
  });
}

function renderEntries(){
  const container = document.getElementById('entries');
  const empty = document.getElementById('emptyState');
  if(allEntries.length === 0){
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = allEntries.map(en => {
    const d = new Date(en.Date);
    const day = isNaN(d) ? '--' : d.getDate();
    const mon = isNaN(d) ? '' : d.toLocaleString('en-IN', {month:'short'});
    const paid = parseFloat(en.AmountPaid) || 0;
    const total = parseFloat(en.TotalAmount) || 0;
    const remaining = total - paid;
    return `
      <div class="entry">
        <div class="e-date"><b>${day}</b>${mon}</div>
        <div class="e-body">
          <div class="e-top">
            <div>
              <div class="e-vendor">${escapeHtml(en.VendorName || '')}</div>
              <span class="e-tag">${escapeHtml(en.Category || '')}</span>
              ${en.PaidBy ? `<span class="e-tag" style="background:rgba(232,163,61,0.18); color:var(--saffron-deep); margin-left:4px;">👤 ${escapeHtml(en.PaidBy)}</span>` : ''}
            </div>
            <div class="e-amt">₹${paid.toLocaleString('en-IN')}</div>
          </div>
          ${remaining > 0 ? `<div class="e-remaining">Due: ₹${remaining.toLocaleString('en-IN')}</div>` : ''}
          ${en.Notes ? `<div class="e-notes">${escapeHtml(en.Notes)}</div>` : ''}
          ${en.PhotoURL ? `<a class="e-photo-link" href="${en.PhotoURL}" target="_blank">📎 View Bill</a>` : ''}
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
